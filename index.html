<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS: GOD-MODE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; font-family: 'Orbitron', sans-serif; cursor: none; touch-action: none; user-select: none; }
        canvas { position: absolute; top: 0; left: 0; }
        #glowCanvas { filter: blur(15px); opacity: 0.6; mix-blend-mode: screen; pointer-events: none; }
        
        /* UI Layer */
        .cursor { position: fixed; width: 30px; height: 30px; border: 2px solid #00ffff; border-radius: 50%; pointer-events: none; z-index: 10000; transition: transform 0.1s ease; box-shadow: 0 0 15px #00ffff; }
        .hud { position: fixed; background: rgba(0, 5, 10, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(0, 242, 255, 0.3); border-radius: 5px; padding: 10px; color: #00ffff; font-size: 10px; z-index: 100; pointer-events: none; }
        .stats { top: 20px; left: 20px; min-width: 180px; }
        .controls { bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; pointer-events: all; }
        
        button { padding: 8px 15px; background: rgba(0, 255, 255, 0.1); border: 1px solid #00ffff; color: #00ffff; font-family: 'Orbitron'; cursor: pointer; text-transform: uppercase; font-size: 10px; transition: 0.3s; }
        button:hover { background: #00ffff; color: #000; box-shadow: 0 0 20px #00ffff; }
        button.active { background: #ff00ff; border-color: #ff00ff; color: #fff; }

        #score-display { position: fixed; top: 20px; right: 20px; font-size: 40px; font-weight: 900; color: #00ff00; text-shadow: 0 0 20px #00ff00; }
        .palette-selector { position: fixed; top: 180px; left: 20px; display: flex; flex-direction: column; gap: 5px; pointer-events: all; }
        .p-btn { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #fff; cursor: pointer; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <canvas id="glowCanvas"></canvas>
    <div class="cursor"></div>
    
    <div id="score-display">000000</div>

    <div class="hud stats">
        NODES: <span id="node-count">0</span> | FPS: <span id="fps">60</span><br>
        COMBO: <span id="combo">0</span>x | AUDIO: <span id="audio-status">OFF</span>
    </div>

    <div class="palette-selector">
        <div class="p-btn" style="background: #FF006E" onclick="setPalette('cyberpunk')"></div>
        <div class="p-btn" style="background: #FF9E00" onclick="setPalette('sunset')"></div>
        <div class="p-btn" style="background: #00FF00" onclick="setPalette('matrix')"></div>
    </div>

    <div class="controls">
        <button id="mic-btn" onclick="initAudio()">INIT SENSES</button>
        <button id="wave-btn" onclick="toggleMode()">MODE: NEURAL</button>
        <button id="k-btn" onclick="toggleKaleidoscope()">KALEIDOSCOPE: OFF</button>
        <button onclick="supernova()">SUPERNOVA (Q)</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const gCanvas = document.getElementById('glowCanvas');
        const gCtx = gCanvas.getContext('2d');
        const cursor = document.querySelector('.cursor');

        let W, H, nodes = [], particles = [], score = 0, combo = 0;
        let mode = 'neural', isK = false, audioEnabled = false;
        let audioCtx, analyser, dataArray, mainGain;
        let tick = 0, shake = 0;
        
        const palettes = {
            cyberpunk: [330, 260, 200],
            sunset: [20, 350, 300],
            matrix: [120, 140, 100]
        };
        let currentPalette = palettes.cyberpunk;

        function resize() {
            W = canvas.width = gCanvas.width = window.innerWidth;
            H = canvas.height = gCanvas.height = window.innerHeight;
        }
        window.onresize = resize;
        resize();

        // --- AUDIO ENGINE ---
        function initAudio() {
            if(audioEnabled) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            mainGain = audioCtx.createGain();
            mainGain.connect(audioCtx.destination);
            mainGain.gain.value = 0.2;

            navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                const src = audioCtx.createMediaStreamSource(stream);
                src.connect(analyser);
                analyser.fftSize = 256;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                audioEnabled = true;
                document.getElementById('audio-status').innerText = "LIVE";
                document.getElementById('mic-btn').classList.add('active');
            });
        }

        function playTone(freq, type = 'sine') {
            if(!audioEnabled) return;
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            g.gain.setValueAtTime(0.1, audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.5);
            osc.connect(g);
            g.connect(mainGain);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        }

        // --- CORE CLASSES ---
        class Node {
            constructor(x, y) {
                this.x = x || Math.random() * W;
                this.y = y || Math.random() * H;
                this.vx = (Math.random() - 0.5) * 4;
                this.vy = (Math.random() - 0.5) * 4;
                this.r = Math.random() * 3 + 2;
                this.hue = currentPalette[0];
                this.mass = this.r;
            }

            update() {
                // Audio Force
                if(audioEnabled) {
                    const bass = dataArray[2] / 255;
                    if(bass > 0.8) {
                        this.vx += (this.x - W/2) * 0.001 * bass;
                        this.vy += (this.y - H/2) * 0.001 * bass;
                    }
                }

                // Physics
                this.x += this.vx;
                this.y += this.vy;
                if(this.x < 0 || this.x > W) this.vx *= -1;
                if(this.y < 0 || this.y > H) this.vy *= -1;

                // Mouse
                let dx = mouse.x - this.x;
                let dy = mouse.y - this.y;
                let d = Math.sqrt(dx*dx + dy*dy);
                if(d < 150) {
                    this.vx += dx * 0.002;
                    this.vy += dy * 0.002;
                }
            }

            draw(targetCtx) {
                targetCtx.beginPath();
                targetCtx.arc(this.x, this.y, this.r, 0, Math.PI*2);
                targetCtx.fillStyle = `hsla(${this.hue}, 100%, 60%, 1)`;
                targetCtx.fill();
            }
        }

        class Particle {
            constructor(x, y, hue) {
                this.x = x; this.y = y;
                this.vx = (Math.random() - 0.5) * 10;
                this.vy = (Math.random() - 0.5) * 10;
                this.life = 1;
                this.hue = hue;
            }
            draw() {
                this.x += this.vx; this.y += this.vy;
                this.life -= 0.02;
                ctx.fillStyle = `hsla(${this.hue}, 100%, 50%, ${this.life})`;
                ctx.fillRect(this.x, this.y, 2, 2);
            }
        }

        // --- LOGIC ---
        let mouse = { x: -100, y: -100 };
        window.addEventListener('mousemove', e => {
            mouse.x = e.clientX; mouse.y = e.clientY;
            cursor.style.transform = `translate(${e.clientX - 15}px, ${e.clientY - 15}px)`;
        });

        function resolveCollision(n1, n2) {
            const dx = n2.x - n1.x;
            const dy = n2.y - n1.y;
            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < n1.r + n2.r) {
                // Elastic collision math
                const angle = Math.atan2(dy, dx);
                const sin = Math.sin(angle), cos = Math.cos(angle);

                // Rotate velocities
                const v1 = { x: n1.vx * cos + n1.vy * sin, y: n1.vy * cos - n1.vx * sin };
                const v2 = { x: n2.vx * cos + n2.vy * sin, y: n2.vy * cos - n2.vx * sin };

                // Swap velocities along X axis
                const tempVx = v1.x;
                v1.x = v2.x;
                v2.x = tempVx;

                // Rotate back
                n1.vx = v1.x * cos - v1.y * sin;
                n1.vy = v1.y * cos + v1.x * sin;
                n2.vx = v2.x * cos - v2.y * sin;
                n2.vy = v2.y * cos + v2.x * sin;

                // Effects
                score += 10;
                combo++;
                playTone(200 + n1.hue);
                shake = 5;
            }
        }

        function supernova() {
            shake = 20;
            nodes.forEach(n => {
                for(let i=0; i<5; i++) particles.push(new Particle(n.x, n.y, n.hue));
            });
            nodes = [];
            for(let i=0; i<60; i++) nodes.push(new Node());
            score += 1000;
        }

        function setPalette(p) {
            currentPalette = palettes[p];
            nodes.forEach(n => n.hue = currentPalette[0]);
        }

        function toggleMode() {
            mode = mode === 'neural' ? 'wave' : 'neural';
            document.getElementById('wave-btn').innerText = `MODE: ${mode.toUpperCase()}`;
        }

        function toggleKaleidoscope() {
            isK = !isK;
            document.getElementById('k-btn').innerText = `KALEIDOSCOPE: ${isK ? 'ON' : 'OFF'}`;
            document.getElementById('k-btn').classList.toggle('active');
        }

        function drawConnections() {
            ctx.lineWidth = 0.5;
            for(let i=0; i<nodes.length; i++) {
                for(let j=i+1; j<nodes.length; j++) {
                    let dx = nodes[i].x - nodes[j].x;
                    let dy = nodes[i].y - nodes[j].y;
                    let d = dx*dx + dy*dy;
                    if(d < 15000) {
                        ctx.beginPath();
                        ctx.strokeStyle = `hsla(${nodes[i].hue}, 100%, 50%, ${1 - d/15000})`;
                        ctx.moveTo(nodes[i].x, nodes[i].y);
                        ctx.lineTo(nodes[j].x, nodes[j].y);
                        ctx.stroke();
                        resolveCollision(nodes[i], nodes[j]);
                    }
                }
            }
        }

        function drawWave() {
            const step = 40;
            const bass = audioEnabled ? dataArray[5]/50 : 1;
            for(let x=0; x<W; x+=step) {
                for(let y=0; y<H; y+=step) {
                    let dx = x - mouse.x;
                    let dy = y - mouse.y;
                    let d = Math.sqrt(dx*dx + dy*dy);
                    let force = Math.sin(d * 0.05 - tick * 0.1) * 20 * bass;
                    ctx.fillStyle = `hsla(${(d + tick)%360}, 100%, 50%, ${Math.max(0, 1-d/400)})`;
                    ctx.fillRect(x + force, y + force, 2, 2);
                }
            }
        }

        function loop() {
            tick++;
            if(shake > 0) shake *= 0.9;
            
            // Screen Shake & Chromatic Aberration logic
            ctx.setTransform(1,0,0,1,0,0);
            ctx.clearRect(0,0,W,H);
            gCtx.clearRect(0,0,W,H);
            
            if(shake > 1) {
                ctx.translate(Math.random()*shake, Math.random()*shake);
            }

            if(audioEnabled) analyser.getByteFrequencyData(dataArray);

            // Kaleidoscope Transform
            if(isK) {
                ctx.save();
                ctx.translate(W/2, H/2);
                for(let i=0; i<8; i++) {
                    ctx.rotate(Math.PI / 4);
                    renderScene();
                }
                ctx.restore();
            } else {
                renderScene();
            }

            document.getElementById('score-display').innerText = score.toString().padStart(6, '0');
            document.getElementById('node-count').innerText = nodes.length;
            document.getElementById('combo').innerText = combo;

            requestAnimationFrame(loop);
        }

        function renderScene() {
            if(mode === 'neural') {
                nodes.forEach(n => {
                    n.update();
                    n.draw(ctx);
                    n.draw(gCtx);
                });
                drawConnections();
            } else {
                drawWave();
            }
            
            particles = particles.filter(p => p.life > 0);
            particles.forEach(p => p.draw());
        }

        // Initialize
        for(let i=0; i<80; i++) nodes.push(new Node());
        loop();

        // Keyboard Shortcuts
        window.onkeydown = (e) => {
            if(e.key === 'q') supernova();
            if(e.key === 'w') toggleMode();
            if(e.key === 'k') toggleKaleidoscope();
        };
    </script>
</body>
</html>
